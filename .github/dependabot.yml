version: 2
updates:
  # The Remotion packages must share one version, so they update together.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      remotion:
        patterns:
          - "remotion"
          - "@remotion/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
